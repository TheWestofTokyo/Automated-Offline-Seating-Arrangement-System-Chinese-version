name: Test and publish Windows application

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - requirements.txt
      - build.ps1
      - 'templates/**'
      - 'LICENSES/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --add-data 'LICENSES;LICENSES' --name '自动化排座管理系统' app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item -LiteralPath 'dist/自动化排座管理系统.exe' -Destination package
          Copy-Item -LiteralPath '使用说明.txt' -Destination package
          Copy-Item -LiteralPath templates -Destination package/templates -Recurse
          Compress-Archive -Path package/* -DestinationPath Automated-Seating-Manager-Windows.zip
          Get-FileHash -LiteralPath 'dist/自动化排座管理系统.exe', Automated-Seating-Manager-Windows.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v6.0.0-build.' + $env:GITHUB_RUN_NUMBER
          gh release create $tag 'dist/自动化排座管理系统.exe' Automated-Seating-Manager-Windows.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title '自动化排座管理系统 v6.0.0' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
